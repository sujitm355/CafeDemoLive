<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="payment-page">
    <div class="payment-header">
        <h1>Payment</h1>

        <div class="payment-nav-buttons">
            <button onclick="goToCart()">Back to Cart</button>
            <button onclick="goToHome()">Home</button>
        </div>
    </div>

    <div class="payment-layout">
        <div class="payment-card">
            <h2 class="payment-section-title">Choose Payment Method</h2>

            <form id="paymentForm">
                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="CARD">
                        <span>Card</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="UPI">
                        <span>UPI</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="CASH">
                        <span id="cash-option-label">Cash</span>
                    </label>
                </div>

                <div id="cardDetailsSection" class="payment-details-section hidden">
                    <h3>Enter Card Details</h3>

                    <label>Card Number</label>
                    <input type="text" id="cardNumber" maxlength="16" placeholder="Enter 16-digit card number">

                    <label>Card Holder Name</label>
                    <input type="text" id="cardHolder" placeholder="Enter card holder name">

                    <div class="payment-row">
                        <div>
                            <label>Expiry</label>
                            <input type="text" id="cardExpiry" maxlength="5" placeholder="MM/YY">
                        </div>

                        <div>
                            <label>CVV</label>
                            <input type="password" id="cardCvv" maxlength="3" placeholder="CVV">
                        </div>
                    </div>
                </div>

                <div id="upiDetailsSection" class="payment-details-section hidden">
                    <h3>Scan QR or Enter UPI ID</h3>

                    <div class="upi-qr-box">
                        <img src="images/upi-qr.png" alt="UPI QR Code" class="upi-qr-image">
                    </div>

                    <label>UPI ID (optional for demo)</label>
                    <input type="text" id="upiId" placeholder="example@upi">
                </div>

                <div style="margin:20px 0;">
                    <h3>Apply Coupon</h3>

                    <input
                        type="text"
                        id="couponCode"
                        placeholder="Enter Coupon Code"
                        style="width:100%;padding:10px;margin-top:10px;"
                    >

                    <button
                        type="button"
                        onclick="applyCoupon()"
                        style="margin-top:10px;padding:10px 15px;background:green;color:white;border:none;border-radius:5px;cursor:pointer;"
                    >
                        Apply Coupon
                    </button>

                    <p id="couponMessage" style="margin-top:10px;font-weight:bold;"></p>
                </div>

                <button type="submit" class="pay-now-btn">Confirm Payment</button>
            </form>
        </div>

        <div class="order-summary-card">
            <h2 class="summary-title">Order Summary</h2>

            <div id="payment-summary-items"></div>

            <div class="summary-total">
                <span>Total</span>
                <span id="payment-total">₹0</span>
            </div>
        </div>
    </div>
</div>

<script src="js/payment.js"></script>
</body>
</html>
