<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History – Sujit's Cafe</title>
<link rel="stylesheet" href="css/style.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f0eb;
    color: #1a1a1a;
    min-height: 100vh;
}

.top-navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: #1a1a1a;
    border-bottom: 2px solid #333;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
    text-decoration: none;
}

.back-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.45);
    color: #ffffff;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    text-decoration: none;
}

.back-btn:hover {
    background: #ffffff;
    color: #1a1a1a;
}

.page-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px;
}

.page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 6px;
}

.page-subtitle {
    color: #555;
    font-size: 0.95rem;
    margin-bottom: 36px;
}

.state-box {
    text-align: center;
    padding: 40px 20px;
    color: #777;
}

.state-box .icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
}

.state-box h3 {
    font-size: 1.2rem;
    margin-bottom: 8px;
    color: #1a1a1a;
}

.state-box p {
    font-size: 0.9rem;
}

.summary-bar {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 20px 28px;
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
    margin-bottom: 28px;
}

.summary-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.summary-item .s-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffffff;
}

.summary-item .s-label {
    font-size: 0.78rem;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.order-card {
    background: #ffffff;
    border: 1px solid #e0dbd4;
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: box-shadow 0.2s, border-color 0.2s;
}

.order-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border-color: #bbb;
}

.order-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    cursor: pointer;
    user-select: none;
    gap: 16px;
    flex-wrap: wrap;
    background: #ffffff;
}

.order-header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.order-number {
    font-size: 1rem;
    font-weight: 700;
    color: #1a1a1a;
}

.order-date {
    font-size: 0.82rem;
    color: #888;
}

.order-header-right {
    display: flex;
    align-items: center;
    gap: 14px;
}

.order-total {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a1a1a;
}

.badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.badge-delivered { background: #d1fae5; color: #065f46; }
.badge-pending   { background: #fef3c7; color: #92400e; }
.badge-confirmed { background: #dbeafe; color: #1e40af; }
.badge-cancelled { background: #fee2e2; color: #991b1b; }
.badge-preparing { background: #ede9fe; color: #5b21b6; }
.badge-default   { background: #f3f4f6; color: #374151; }

.chevron {
    color: #999;
    font-size: 0.85rem;
    transition: transform 0.25s;
}

.chevron.open {
    transform: rotate(180deg);
}

.order-details {
    display: none;
    border-top: 1px solid #f0ece6;
    padding: 20px 24px;
    background: #faf8f5;
}

.order-details.open {
    display: block;
}

.meta-row {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.meta-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.meta-label {
    font-size: 0.72rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.6px;
}

.meta-value {
    font-size: 0.92rem;
    color: #1a1a1a;
    font-weight: 600;
}

.items-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 10px;
}

.items-table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e8e4de;
}

.items-table th {
    text-align: left;
    font-size: 0.75rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 14px;
    background: #f5f0eb;
    border-bottom: 1px solid #e8e4de;
}

.items-table td {
    padding: 11px 14px;
    font-size: 0.9rem;
    color: #1a1a1a;
    border-bottom: 1px solid #f0ece6;
}

.items-table tr:last-child td {
    border-bottom: none;
}

.items-table td.right,
.items-table th.right {
    text-align: right;
}

.total-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #e0dbd4;
    gap: 16px;
    align-items: center;
}

.total-label {
    color: #777;
    font-size: 0.9rem;
}

.total-value {
    color: #1a1a1a;
    font-weight: 800;
    font-size: 1.05rem;
}

.history-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 30px;
    align-items: start;
}

.history-section h2 {
    margin-bottom: 15px;
}

.cancel-btn {
    background: #dc2626;
    color: white;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    margin-top: 8px;
}

@media (max-width: 900px) {
    .history-layout {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .top-navbar {
        padding: 14px 16px;
    }

    .page-container {
        padding: 24px 14px;
    }

    .order-header {
        padding: 14px 16px;
    }

    .order-details {
        padding: 16px;
    }

    .summary-bar {
        gap: 20px;
        padding: 16px 20px;
    }
}
</style>
</head>

<body>

<header class="top-navbar">
    <a class="logo" href="index.html">Sujit's Cafe</a>
    <a class="back-btn" href="index.html">← Back to Home</a>
</header>

<div class="page-container">

    <h1 class="page-title">Order History</h1>
    <p class="page-subtitle" id="welcomeMsg">Your previous orders</p>

    <div class="state-box" id="emptyState" style="display:none;">
        <div class="icon">🛒</div>
        <h3>No orders yet</h3>
        <p>Once you place an order, it will appear here.</p>
    </div>

    <div class="summary-bar" id="summaryBar" style="display:none;">
        <div class="summary-item">
            <span class="s-value" id="totalOrders">0</span>
            <span class="s-label">Total Orders</span>
        </div>
        <div class="summary-item">
            <span class="s-value" id="totalItems">0</span>
            <span class="s-label">Items Ordered</span>
        </div>
        <div class="summary-item" style="margin-left:auto;">
            <span class="s-value" id="totalSpent">₹0</span>
            <span class="s-label">Total Spent</span>
        </div>
    </div>

    <div class="history-layout">

        <div class="history-section">
            <h2>🍽 Food Orders</h2>
            <div id="ordersList"></div>
        </div>

        <div class="history-section">
            <h2>📅 Table Bookings</h2>
            <div id="bookingList"></div>
        </div>

    </div>

</div>

<script src="js/main.js"></script>

<script>
function badgeClass(status) {
    if (!status) return "badge-default";

    switch (status.toUpperCase()) {
        case "DELIVERED":  return "badge-delivered";
        case "PENDING":    return "badge-pending";
        case "CONFIRMED":  return "badge-confirmed";
        case "CANCELLED":  return "badge-cancelled";
        case "PREPARING":  return "badge-preparing";
        default:           return "badge-default";
    }
}

function formatDate(dateStr) {
    if (!dateStr) return "—";

    try {
        const d = new Date(dateStr);
        return d.toLocaleString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    } catch (e) {
        return dateStr;
    }
}

function formatType(type) {
    if (!type) return "—";

    switch (type.toUpperCase()) {
        case "ONLINE":     return "🚚 Online Delivery";
        case "DRIVE_THRU": return "🚗 Drive-Thru";
        case "DINE_IN":    return "🍽️ Dine-In";
        default:           return type;
    }
}

function toggleOrder(id) {
    const details = document.getElementById("details-" + id);
    const chevron = document.getElementById("chevron-" + id);

    if (!details || !chevron) return;

    const isOpen = details.classList.contains("open");

    details.classList.toggle("open", !isOpen);
    chevron.classList.toggle("open", !isOpen);
}

function buildOrderCard(order) {
    const itemRows = (order.items || []).map(item => `
        <tr>
            <td>${item.name || item.itemName || "—"}</td>
            <td class="right">${item.quantity}</td>
            <td class="right">₹${parseFloat(item.price || 0).toFixed(2)}</td>
            <td class="right">₹${parseFloat(item.subtotal || 0).toFixed(2)}</td>
        </tr>
    `).join("");

    const noItems = (!order.items || order.items.length === 0)
        ? `<p style="color:#888;font-size:0.9rem;padding:8px 0;">No item details available.</p>`
        : "";

    return `
    <div class="order-card">
        <div class="order-header" onclick="toggleOrder(${order.orderId})">
            <div class="order-header-left">
                <span class="order-number"># ${order.orderNumber}</span>
                <span class="order-date">${formatDate(order.createdAt)}</span>
            </div>
            <div class="order-header-right">
                <span class="badge ${badgeClass(order.orderStatus)}">${order.orderStatus || "Unknown"}</span>
                <span class="order-total">₹${parseFloat(order.totalAmount || 0).toFixed(2)}</span>
                <span class="chevron" id="chevron-${order.orderId}">▼</span>
            </div>
        </div>

        <div class="order-details" id="details-${order.orderId}">
            <div class="meta-row">
                <div class="meta-item">
                    <span class="meta-label">Order Type</span>
                    <span class="meta-value">${formatType(order.orderType)}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Payment</span>
                    <span class="meta-value">${order.paymentMethod || "—"}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Payment Status</span>
                    <span class="meta-value">${order.paymentStatus || "—"}</span>
                </div>
            </div>

            ${order.items && order.items.length > 0 ? `
            <p class="items-title">Items Ordered</p>
            <table class="items-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th class="right">Qty</th>
                        <th class="right">Price</th>
                        <th class="right">Subtotal</th>
                    </tr>
                </thead>
                <tbody>${itemRows}</tbody>
            </table>
            ` : noItems}

            <div class="total-row">
                <span class="total-label">Order Total</span>
                <span class="total-value">₹${parseFloat(order.totalAmount || 0).toFixed(2)}</span>
            </div>
        </div>
    </div>`;
}

function loadOrderHistory() {
    const user = getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("welcomeMsg").textContent =
        `Showing all orders for ${user.firstName} ${user.lastName}`;

    const allOrders = JSON.parse(localStorage.getItem("orders")) || [];

    const orders = allOrders.filter(order =>
        order.phone === user.mobile ||
        order.customerName === user.firstName + " " + user.lastName
    );

    if (!orders || orders.length === 0) {
        document.getElementById("emptyState").style.display = "block";
        document.getElementById("ordersList").innerHTML =
            `<div class="state-box">
                <div class="icon">🛒</div>
                <h3>No food orders yet</h3>
                <p>Once you place an order, it will appear here.</p>
            </div>`;
    } else {
        const totalSpent = orders.reduce((sum, o) => sum + parseFloat(o.totalAmount || 0), 0);
        const totalItems = orders.reduce((sum, o) => {
            return sum + (o.items ? o.items.reduce((itemSum, item) => itemSum + Number(item.quantity || 0), 0) : 0);
        }, 0);

        document.getElementById("totalOrders").textContent = orders.length;
        document.getElementById("totalSpent").textContent = "₹" + totalSpent.toFixed(2);
        document.getElementById("totalItems").textContent = totalItems;
        document.getElementById("summaryBar").style.display = "flex";

        document.getElementById("ordersList").innerHTML =
            orders.map(buildOrderCard).join("");
    }
}

function buildBookingCard(booking) {
    const tableNumber =
        booking.restaurantTable && booking.restaurantTable.tableNumber
            ? booking.restaurantTable.tableNumber
            : booking.tableId;

    return `
    <div class="order-card">
        <div class="order-header">
            <div class="order-header-left">
                <span class="order-number">Booking #${booking.bookingId}</span>
                <span class="order-date">Booked for: ${booking.bookingDate} at ${booking.bookingTime}</span>
            </div>
            <div class="order-header-right">
                <span class="badge ${booking.status === "CONFIRMED" ? "badge-confirmed" : "badge-cancelled"}">
                    ${booking.status}
                </span>
            </div>
        </div>

        <div class="order-details open">
            <div class="meta-row">
                <div class="meta-item">
                    <span class="meta-label">Customer Name</span>
                    <span class="meta-value">${booking.customerName}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Table Number</span>
                    <span class="meta-value">Table ${tableNumber}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Date</span>
                    <span class="meta-value">${booking.bookingDate}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Time</span>
                    <span class="meta-value">${booking.bookingTime}</span>
                </div>
            </div>

            ${booking.status === "CONFIRMED" ? `
            <button class="cancel-btn" onclick="cancelBookingFromHistory(${booking.bookingId})">
                Cancel Booking
            </button>` : ""}
        </div>
    </div>`;
}

function loadBookingHistory() {
    const user = getUser();

    if (!user) return;

    const allBookings = JSON.parse(localStorage.getItem("bookings")) || [];

    const bookings = allBookings.filter(booking =>
        booking.customerId === user.customerId ||
        booking.customerName === user.firstName + " " + user.lastName
    );

    const container = document.getElementById("bookingList");

    if (!bookings || bookings.length === 0) {
        container.innerHTML = `
            <div class="state-box">
                <div class="icon">📅</div>
                <h3>No bookings yet</h3>
                <p>Once you book a table, it will appear here.</p>
            </div>`;
        return;
    }

    container.innerHTML = bookings.map(buildBookingCard).join("");
}

function cancelBookingFromHistory(bookingId) {
    if (!confirm("Are you sure you want to cancel this booking?")) return;

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings = bookings.map(booking => {
        if (Number(booking.bookingId) === Number(bookingId)) {
            booking.status = "CANCELLED";
        }
        return booking;
    });

    localStorage.setItem("bookings", JSON.stringify(bookings));

    const lastBooking = JSON.parse(localStorage.getItem("lastBooking"));

    if (lastBooking && Number(lastBooking.bookingId) === Number(bookingId)) {
        lastBooking.status = "CANCELLED";
        localStorage.setItem("lastBooking", JSON.stringify(lastBooking));
        localStorage.setItem("latestBooking", JSON.stringify(lastBooking));
    }

    alert("Booking cancelled successfully.");

    loadBookingHistory();
}

loadOrderHistory();
loadBookingHistory();
</script>

</body>
</html>
