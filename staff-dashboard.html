<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
    <style>
        body { font-family: Arial; background:#f5f5f5; margin:0; }
        header { background:#000; color:white; padding:18px 40px; display:flex; justify-content:space-between; }
        .container { padding:30px; }
        .box { background:white; padding:20px; border-radius:10px; margin-bottom:25px; }
        input, select { width:100%; padding:10px; margin:8px 0; }
        button { padding:10px 15px; background:#000; color:white; border:none; border-radius:5px; cursor:pointer; }
        table { width:100%; border-collapse:collapse; margin-top:15px; background:white; }
        th, td { border:1px solid #ddd; padding:10px; text-align:left; }
        th { background:#000; color:white; }
        .danger { background:#c0392b; }
        .success { background:green; }
        @media print {
            body * { visibility:hidden; }
            #billArea, #billArea * { visibility:visible; }
            #billArea { position:absolute; left:0; top:0; width:100%; }
            button { display:none; }
        }
    </style>
</head>
<body>

<header>
    <h2>Staff Dashboard</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="box">
        <h2>Take Customer Order</h2>

        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter customer name">

        <label>Mobile Number</label>
        <input type="text" id="phone" placeholder="Enter mobile number">

        <label>Email Optional</label>
        <input type="text" id="email" placeholder="Enter email optional">

        <label>Order Type</label>
        <select id="orderType">
            <option value="DRIVE_THRU">Drive-Thru</option>
            <option value="DINE_IN">Dine-In</option>
            <option value="ONLINE">Online</option>
        </select>

        <label>Payment Method</label>
        <select id="paymentMethod">
            <option value="CASH">Cash</option>
            <option value="UPI">UPI</option>
            <option value="CARD">Card</option>
        </select>
    </div>

    <div class="box">
        <h2>Select Menu Items</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Add</th>
                </tr>
            </thead>
            <tbody id="menuTable"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>Current Bill</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>

        <h3>Total: Rs. <span id="totalAmount">0</span></h3>

        <button class="success" onclick="placeStaffOrder()">Place Order</button>
    </div>

    <div class="box" id="billArea" style="display:none;">
        <h2>Sujit's Cafe</h2>
        <h3>Customer Bill</h3>
        <p id="billOrderNo"></p>
        <p id="billCustomer"></p>
        <p id="billPhone"></p>
        <p id="billPayment"></p>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="billItems"></tbody>
        </table>

        <h3>Total: Rs. <span id="billTotal"></span></h3>

        <button onclick="window.print()">Print Bill</button>
    </div>

</div>

<script>
const staff = localStorage.getItem("staffUser");
if (!staff) {
    window.location.href = "login.html";
}

let menuItems = [];
let cart = [];

function loadMenu() {

    menuItems = JSON.parse(localStorage.getItem("menuItems")) || [];

    if(menuItems.length === 0){

        menuItems = [
            {
                itemId: 1,
                itemName: "Veg Burger",
                category: "Burger",
                price: 120
            },
            {
                itemId: 2,
                itemName: "Chicken Burger",
                category: "Burger",
                price: 180
            },
            {
                itemId: 3,
                itemName: "Cold Coffee",
                category: "Beverage",
                price: 90
            }
        ];

        localStorage.setItem(
            "menuItems",
            JSON.stringify(menuItems)
        );
    }

    document.getElementById("menuTable").innerHTML = menuItems.map(item => `
        <tr>
            <td>${item.itemName}</td>
            <td>${item.category}</td>
            <td>Rs. ${item.price}</td>
            <td>
                <input type="number" id="qty-${item.itemId}" value="1" min="1">
            </td>
            <td>
                <button onclick="addToCart(${item.itemId})">Add</button>
            </td>
        </tr>
    `).join("");
}

function addToCart(itemId) {
    const item = menuItems.find(i => i.itemId === itemId);
    const qty = parseInt(document.getElementById("qty-" + itemId).value);

    if (!item || qty <= 0) return;

    const existing = cart.find(c => c.itemId === itemId);

    if (existing) {
        existing.quantity += qty;
    } else {
        cart.push({
            itemId: item.itemId,
            itemName: item.itemName,
            price: item.price,
            quantity: qty
        });
    }

    renderCart();
}

function renderCart() {
    let total = 0;

    document.getElementById("cartTable").innerHTML = cart.map((item, index) => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        return `
            <tr>
                <td>${item.itemName}</td>
                <td>${item.quantity}</td>
                <td>Rs. ${item.price}</td>
                <td>Rs. ${subtotal}</td>
                <td><button class="danger" onclick="removeItem(${index})">Remove</button></td>
            </tr>
        `;
    }).join("");

    document.getElementById("totalAmount").innerText = total.toFixed(2);
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

async function placeStaffOrder() {
    const customerName = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const orderType = document.getElementById("orderType").value;
    const paymentMethod = document.getElementById("paymentMethod").value;

    if (!customerName || !phone) {
        alert("Please enter customer name and mobile number.");
        return;
    }

    if (cart.length === 0) {
        alert("Please add at least one item.");
        return;
    }

    const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    const orderRequest = {
        orderType: orderType,
        customerName: customerName,
        phone: phone,
        addressLine: null,
        city: null,
        pincode: null,
        paymentMethod: paymentMethod,
        paymentStatus: "SUCCESS",
        totalAmount: totalAmount,
        items: cart.map(item => ({
            itemId: item.itemId,
            quantity: item.quantity,
            price: item.price
        }))
    };

   const orderNumber =
    "ORD" + Date.now();

let orders =
    JSON.parse(localStorage.getItem("orders")) || [];

orders.push({
    orderNumber,
    customerName,
    phone,
    orderType,
    paymentMethod,
    totalAmount,
    items: cart,
    createdAt: new Date().toISOString()
});

localStorage.setItem(
    "orders",
    JSON.stringify(orders)
);

alert("Order created successfully!");

showBill(
    orderNumber,
    customerName,
    phone,
    paymentMethod,
    totalAmount
);

    
}

function showBill(orderNumber, customerName, phone, paymentMethod, totalAmount) {
    document.getElementById("billArea").style.display = "block";
    document.getElementById("billOrderNo").innerText = "Order No: " + orderNumber;
    document.getElementById("billCustomer").innerText = "Customer: " + customerName;
    document.getElementById("billPhone").innerText = "Phone: " + phone;
    document.getElementById("billPayment").innerText = "Payment: " + paymentMethod;

    document.getElementById("billItems").innerHTML = cart.map(item => `
        <tr>
            <td>${item.itemName}</td>
            <td>${item.quantity}</td>
            <td>Rs. ${item.price}</td>
            <td>Rs. ${(item.price * item.quantity).toFixed(2)}</td>
        </tr>
    `).join("");

    document.getElementById("billTotal").innerText = totalAmount.toFixed(2);
}

function logout() {
    localStorage.removeItem("staffUser");
    window.location.href = "login.html";
}

loadMenu();
</script>

</body>
</html>
