<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
    <style>
        body { font-family: Arial; background:#f5f5f5; margin:0; }
        header { background:#000; color:white; padding:18px 40px; display:flex; justify-content:space-between; }
        .container { padding:30px; }
        .box { background:white; padding:20px; border-radius:10px; margin-bottom:25px; }
        input, select { width:100%; padding:10px; margin:8px 0; }
        button { padding:10px 15px; background:#000; color:white; border:none; border-radius:5px; cursor:pointer; }
        table { width:100%; border-collapse:collapse; margin-top:15px; background:white; }
        th, td { border:1px solid #ddd; padding:10px; text-align:left; }
        th { background:#000; color:white; }
        .danger { background:#c0392b; }
        .success { background:green; }
        @media print {
            body * { visibility:hidden; }
            #billArea, #billArea * { visibility:visible; }
            #billArea { position:absolute; left:0; top:0; width:100%; }
            button { display:none; }
        }
    </style>
</head>
<body>

<header>
    <h2>Staff Dashboard</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="box">
        <h2>Take Customer Order</h2>

        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter customer name">

        <label>Mobile Number</label>
        <input type="text" id="phone" placeholder="Enter mobile number">

        <label>Email Optional</label>
        <input type="text" id="email" placeholder="Enter email optional">

        <label>Order Type</label>
        <select id="orderType">
            <option value="DRIVE_THRU">Drive-Thru</option>
            <option value="DINE_IN">Dine-In</option>
            <option value="ONLINE">Online</option>
        </select>

        <label>Payment Method</label>
        <select id="paymentMethod">
            <option value="CASH">Cash</option>
            <option value="UPI">UPI</option>
            <option value="CARD">Card</option>
        </select>
    </div>

    <div class="box">
        <h2>Select Menu Items</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody id="menuTable"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>Current Bill</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>

        <h3>Total: Rs. <span id="totalAmount">0</span></h3>

        <button class="success" onclick="placeStaffOrder()">Place Order</button>
    </div>

    <div class="box" id="billArea" style="display:none;">
        <h2>Sujit's Cafe</h2>
        <h3>Customer Bill</h3>
        <p id="billOrderNo"></p>
        <p id="billCustomer"></p>
        <p id="billPhone"></p>
        <p id="billPayment"></p>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="billItems"></tbody>
        </table>

        <h3>Total: Rs. <span id="billTotal"></span></h3>

        <button onclick="window.print()">Print Bill</button>
    </div>

    <div class="box">
        <h2>Update Order Status</h2>

        <table>
            <thead>
                <tr>
                    <th>Order No</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Order Type</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="staffOrdersTable"></tbody>
        </table>
    </div>

</div>

<script src="js/menu-data.js"></script>
<script>
const staff = JSON.parse(localStorage.getItem("staffUser"));

if (!staff || staff.role !== "STAFF") {
    window.location.href = "login.html";
}

let staffMenuItems = [];
let cart = [];

function loadMenu() {
    staffMenuItems = JSON.parse(localStorage.getItem("menuItems")) || [];

    if (staffMenuItems.length === 0 && typeof menuItems !== "undefined") {
        staffMenuItems = menuItems;
        localStorage.setItem("menuItems", JSON.stringify(staffMenuItems));
    }

    document.getElementById("menuTable").innerHTML = staffMenuItems.map(item => `
        <tr>
            <td>${item.itemName}</td>
            <td>${item.category}</td>
            <td>Rs. ${item.price}</td>
            <td>
                <button onclick="decreaseQty(${item.itemId})">-</button>
                <span id="qty-display-${item.itemId}" style="margin:0 12px;font-weight:bold;">0</span>
                <button onclick="increaseQty(${item.itemId})">+</button>
            </td>
        </tr>
    `).join("");
}

function increaseQty(itemId) {
    const item = staffMenuItems.find(i => Number(i.itemId) === Number(itemId));

    if (!item) return;

    const existing = cart.find(c => Number(c.itemId) === Number(itemId));

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            itemId: item.itemId,
            itemName: item.itemName,
            price: Number(item.price),
            quantity: 1
        });
    }

    updateMenuQty(itemId);
    renderCart();
}

function decreaseQty(itemId) {
    const existing = cart.find(c => Number(c.itemId) === Number(itemId));

    if (!existing) return;

    existing.quantity--;

    if (existing.quantity <= 0) {
        cart = cart.filter(c => Number(c.itemId) !== Number(itemId));
    }

    updateMenuQty(itemId);
    renderCart();
}

function updateMenuQty(itemId) {
    const existing = cart.find(c => Number(c.itemId) === Number(itemId));
    const qtyBox = document.getElementById("qty-display-" + itemId);

    if (qtyBox) {
        qtyBox.innerText = existing ? existing.quantity : 0;
    }
}

function renderCart() {
    let total = 0;

    document.getElementById("cartTable").innerHTML = cart.map((item, index) => {
        const subtotal = Number(item.price) * Number(item.quantity);
        total += subtotal;

        return `
            <tr>
                <td>${item.itemName}</td>
                <td>${item.quantity}</td>
                <td>Rs. ${item.price}</td>
                <td>Rs. ${subtotal.toFixed(2)}</td>
                <td><button class="danger" onclick="removeItem(${index})">Remove</button></td>
            </tr>
        `;
    }).join("");

    document.getElementById("totalAmount").innerText = total.toFixed(2);
}

function removeItem(index) {
    const itemId = cart[index].itemId;
    cart.splice(index, 1);
    updateMenuQty(itemId);
    renderCart();
}

function placeStaffOrder() {
    const customerName = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const orderType = document.getElementById("orderType").value;
    const paymentMethod = document.getElementById("paymentMethod").value;

    if (!customerName || !phone) {
        alert("Please enter customer name and mobile number.");
        return;
    }

    if (cart.length === 0) {
        alert("Please add at least one item.");
        return;
    }

    const totalAmount = cart.reduce((sum, item) => sum + Number(item.price) * Number(item.quantity), 0);
    const orderNumber = "ORD" + Date.now();

    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    const billItems = cart.map(item => ({
        itemId: item.itemId,
        itemName: item.itemName,
        name: item.itemName,
        quantity: item.quantity,
        price: item.price,
        subtotal: Number(item.price) * Number(item.quantity)
    }));

    orders.push({
        orderId: Date.now(),
        orderNumber: orderNumber,
        customerName: customerName,
        phone: phone,
        orderType: orderType,
        paymentMethod: paymentMethod,
        paymentStatus: "SUCCESS",
        totalAmount: totalAmount,
        orderStatus: "PLACED",
        items: billItems,
        createdAt: new Date().toISOString()
    });

    localStorage.setItem("orders", JSON.stringify(orders));

    alert("Order created successfully!");

    showBill(orderNumber, customerName, phone, paymentMethod, totalAmount, billItems);

    cart = [];
    renderCart();
    resetAllMenuQty();

    loadStaffOrders();
}

function resetAllMenuQty() {
    staffMenuItems.forEach(item => updateMenuQty(item.itemId));
}

function showBill(orderNumber, customerName, phone, paymentMethod, totalAmount, billItems) {
    document.getElementById("billArea").style.display = "block";
    document.getElementById("billOrderNo").innerText = "Order No: " + orderNumber;
    document.getElementById("billCustomer").innerText = "Customer: " + customerName;
    document.getElementById("billPhone").innerText = "Phone: " + phone;
    document.getElementById("billPayment").innerText = "Payment: " + paymentMethod;

    document.getElementById("billItems").innerHTML = billItems.map(item => `
        <tr>
            <td>${item.itemName}</td>
            <td>${item.quantity}</td>
            <td>Rs. ${item.price}</td>
            <td>Rs. ${Number(item.subtotal).toFixed(2)}</td>
        </tr>
    `).join("");

    document.getElementById("billTotal").innerText = Number(totalAmount).toFixed(2);
}

function getStatusDropdown(order) {
    const type = (order.orderType || "").toUpperCase();
    const status = order.orderStatus || "PLACED";

    if (type === "DINE_IN") {
        return `<span>No tracking for Dine-In</span>`;
    }

    if (type === "DRIVE_THRU") {
        return `
            <select onchange="updateOrderStatus('${order.orderNumber}', this.value)">
                <option value="PLACED" ${status === "PLACED" ? "selected" : ""}>PLACED</option>
                <option value="PREPARING" ${status === "PREPARING" ? "selected" : ""}>PREPARING</option>
                <option value="READY_FOR_PICKUP" ${status === "READY_FOR_PICKUP" ? "selected" : ""}>READY FOR PICKUP</option>
                <option value="DELIVERED" ${status === "DELIVERED" ? "selected" : ""}>DELIVERED</option>
            </select>
        `;
    }

    return `
        <select onchange="updateOrderStatus('${order.orderNumber}', this.value)">
            <option value="PLACED" ${status === "PLACED" ? "selected" : ""}>PLACED</option>
            <option value="PREPARING" ${status === "PREPARING" ? "selected" : ""}>PREPARING</option>
            <option value="OUT_FOR_DELIVERY" ${status === "OUT_FOR_DELIVERY" ? "selected" : ""}>OUT FOR DELIVERY</option>
            <option value="DELIVERED" ${status === "DELIVERED" ? "selected" : ""}>DELIVERED</option>
        </select>
    `;
}

function loadStaffOrders() {
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    const table = document.getElementById("staffOrdersTable");

    if (!table) return;

    if (orders.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="6">No orders available.</td>
            </tr>
        `;
        return;
    }

    table.innerHTML = orders.map(order => `
        <tr>
            <td>${order.orderNumber || "-"}</td>
            <td>${order.customerName || "-"}</td>
            <td>${order.phone || "-"}</td>
            <td>${order.orderType || "-"}</td>
            <td>Rs. ${Number(order.totalAmount || 0).toFixed(2)}</td>
            <td>${getStatusDropdown(order)}</td>
        </tr>
    `).join("");
}

function updateOrderStatus(orderNumber, status) {
    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    orders = orders.map(order => {
        if (order.orderNumber === orderNumber) {
            order.orderStatus = status;
        }
        return order;
    });

    localStorage.setItem("orders", JSON.stringify(orders));

    alert("Order status updated successfully.");

    loadStaffOrders();
}

function logout() {
    localStorage.removeItem("staffUser");
    window.location.href = "login.html";
}

loadMenu();
loadStaffOrders();
</script>

</body>
</html>
