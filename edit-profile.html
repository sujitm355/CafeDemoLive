<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Edit Profile – Sujit's Cafe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
    nav { background:#000; padding:0 40px; height:60px; display:flex; align-items:center; justify-content:space-between; }
    nav .brand { color:#fff; font-size:20px; font-weight:bold; text-decoration:none; }
    nav a { color:#fff; text-decoration:none; font-size:15px; }
    .page-center { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .card { background:#fff; border:1px solid #e0e0e0; border-radius:12px; padding:40px 36px; width:100%; max-width:460px; }
    .card h2 { font-size:26px; font-weight:bold; margin-bottom:6px; color:#111; }
    .card p.sub { font-size:14px; color:#666; margin-bottom:28px; }
    .row { display:flex; gap:14px; }
    .row > div { flex:1; }
    label { display:block; font-size:13px; font-weight:bold; color:#333; margin-bottom:5px; margin-top:16px; }
    input { width:100%; padding:11px 14px; border:1px solid #ccc; border-radius:8px; font-size:14px; outline:none; transition:border 0.2s; }
    input:focus { border-color:#000; }
    .hint { font-size:12px; color:#888; margin-top:4px; }
    .btn { display:block; width:100%; padding:13px; background:#000; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; margin-top:24px; transition:background 0.2s; }
    .btn:hover { background:#222; }
    .btn-back { display:block; width:100%; padding:11px; background:#fff; color:#000; border:1px solid #ccc; border-radius:8px; font-size:14px; cursor:pointer; margin-top:10px; }
    .btn-back:hover { background:#f5f5f5; }
    .msg { margin-top:14px; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
    .msg.error   { background:#fff0f0; color:#c0392b; border:1px solid #f5c6cb; }
    .msg.success { background:#f0fff4; color:#27ae60; border:1px solid #b2dfdb; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="index.html">Sujit's Cafe</a>
  <a href="index.html">Home</a>
</nav>

<div class="page-center">
  <div class="card">
    <h2>Edit Profile</h2>
    <p class="sub">Update your account details</p>

    <div class="row">
      <div>
        <label>First Name</label>
        <input type="text" id="firstName"/>
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" id="lastName"/>
      </div>
    </div>

    <label>Email Address</label>
    <input type="email" id="email"/>

    <label>Mobile Number</label>
    <input type="text" id="mobile" maxlength="10"/>

    <label>New Password</label>
<input type="password" id="password" placeholder="Leave blank to keep current"/>

<div id="passwordRules" style="margin-top:8px;font-size:12px;color:#666;display:none;">
  <div id="ruleLength">❌ Minimum 8 characters</div>
  <div id="ruleUpper">❌ One uppercase letter</div>
  <div id="ruleLower">❌ One lowercase letter</div>
  <div id="ruleNumber">❌ One number</div>
  <div id="ruleSpecial">❌ One special character</div>
</div>

<p class="hint">Leave blank if you don't want to change your password.</p>

    <button class="btn" onclick="saveProfile()">Save Changes</button>
    <button class="btn-back" onclick="window.location.href='index.html'">Back to Home</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const raw = localStorage.getItem("cafeUser");

if (!raw) {
    window.location.href = "login.html";
}

let user = JSON.parse(raw);

document.getElementById("firstName").value = user.firstName || "";
document.getElementById("lastName").value  = user.lastName || "";
document.getElementById("email").value     = user.email || "";
document.getElementById("mobile").value    = user.mobile || "";

function saveProfile() {
    const updatedData = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        mobile: document.getElementById("mobile").value.trim(),
        password: document.getElementById("password").value.trim()
    };

    if (!updatedData.firstName || !updatedData.lastName || !updatedData.email || !updatedData.mobile) {
        showMsg("All fields except password are required.", "error");
        return;
    }

    if (!/^\d{10}$/.test(updatedData.mobile)) {
        showMsg("Mobile number must be 10 digits.", "error");
        return;
    }

    if (updatedData.password !== "") {
        const passwordRegex =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#!])[A-Za-z\d@$!%*?&#!]{8,}$/;

        if (!passwordRegex.test(updatedData.password)) {
            showMsg(
                "Password must contain uppercase, lowercase, number, special character and minimum 8 characters.",
                "error"
            );
            return;
        }
    }

    let users = JSON.parse(localStorage.getItem("cafeUsers")) || [];

    users = users.map(existingUser => {
        if (existingUser.customerId === user.customerId) {
            return {
                ...existingUser,
                firstName: updatedData.firstName,
                lastName: updatedData.lastName,
                email: updatedData.email,
                mobile: updatedData.mobile,
                password: updatedData.password !== "" ? updatedData.password : existingUser.password
            };
        }
        return existingUser;
    });

    const updatedUser = {
        ...user,
        firstName: updatedData.firstName,
        lastName: updatedData.lastName,
        email: updatedData.email,
        mobile: updatedData.mobile
    };

    localStorage.setItem("cafeUsers", JSON.stringify(users));
    localStorage.setItem("cafeUser", JSON.stringify(updatedUser));

    user = updatedUser;

    showMsg("Profile updated successfully!", "success");
}

function showMsg(text, type) {
    const m = document.getElementById("msg");
    m.textContent = text;
    m.className = "msg " + type;
    m.style.display = "block";
}

const passwordInput = document.getElementById("password");
const rules = document.getElementById("passwordRules");

passwordInput.addEventListener("input", function () {
    const value = passwordInput.value;

    if (value.length === 0) {
        rules.style.display = "none";
        return;
    }

    rules.style.display = "block";

    document.getElementById("ruleLength").innerHTML =
        value.length >= 8 ? "✅ Minimum 8 characters" : "❌ Minimum 8 characters";

    document.getElementById("ruleUpper").innerHTML =
        /[A-Z]/.test(value) ? "✅ One uppercase letter" : "❌ One uppercase letter";

    document.getElementById("ruleLower").innerHTML =
        /[a-z]/.test(value) ? "✅ One lowercase letter" : "❌ One lowercase letter";

    document.getElementById("ruleNumber").innerHTML =
        /\d/.test(value) ? "✅ One number" : "❌ One number";

    document.getElementById("ruleSpecial").innerHTML =
        /[@$!%*?&#!]/.test(value) ? "✅ One special character" : "❌ One special character";
});
</script>

</body>
</html>
