<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Booking - Sujit's Cafe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    min-height:100vh;
}

.header{
    background:#000;
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.booking-container{
    width:100%;
    max-width:450px;
    margin:50px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

.booking-container h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus{
    outline:none;
    border-color:#000;
}

.btn-book{
    width:100%;
    padding:14px;
    background:#000;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.btn-book:hover{
    background:#222;
}

#message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#e8f5e9;
    color:#2e7d32;
    border:1px solid #a5d6a7;
}

.error{
    background:#ffebee;
    color:#c62828;
    border:1px solid #ef9a9a;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#000;
    font-weight:bold;
}

.back-link:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="header">
    Sujit's Cafe
</div>

<div class="booking-container">

    <h2>Table Booking</h2>

    <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="customerName" customerName>
    </div>

    <div class="form-group">
        <label>Booking Date</label>
        <input type="date" id="bookingDate">
    </div>

    <div class="form-group">
        <label>Booking Time</label>
        <select id="bookingTime">
            <option value="">-- Select Time --</option>
            <option value="11:00">11:00 AM</option>
            <option value="12:00">12:00 PM</option>
            <option value="13:00">01:00 PM</option>
            <option value="14:00">02:00 PM</option>
            <option value="15:00">03:00 PM</option>
            <option value="16:00">04:00 PM</option>
            <option value="17:00">05:00 PM</option>
            <option value="18:00">06:00 PM</option>
            <option value="19:00">07:00 PM</option>
            <option value="20:00">08:00 PM</option>
            <option value="21:00">09:00 PM</option>
            <option value="22:00">10:00 PM</option>
        </select>
    </div>

    <div class="form-group">
        <label>Select Table</label>
        <select id="tableId">
            <option value="">-- Select Table --</option>
            <option value="1">Table 1 (4 Seats)</option>
            <option value="2">Table 2 (4 Seats)</option>
            <option value="3">Table 3 (4 Seats)</option>
            <option value="4">Table 4 (4 Seats)</option>
            <option value="5">Table 5 (4 Seats)</option>
            <option value="6">Table 6 (4 Seats)</option>
            <option value="7">Table 7 (4 Seats)</option>
            <option value="8">Table 8 (4 Seats)</option>
            <option value="9">Table 9 (4 Seats)</option>
            <option value="10">Table 10 (4 Seats)</option>
        </select>
    </div>

    <button class="btn-book" onclick="submitBooking()">
        Confirm Booking
    </button>

    <div id="message"></div>

    <a href="index.html" class="back-link">← Back to Home</a>

</div>

<script>
const user = JSON.parse(localStorage.getItem("cafeUser"));

if (!user) {
    window.location.href = "login.html";
} else {
    document.getElementById("customerName").value =
        user.firstName + " " + user.lastName;
}

// Set minimum date to today
document.getElementById("bookingDate").min =
    new Date().toISOString().split("T")[0];

function submitBooking() {
    const name = document.getElementById("customerName").value.trim();
    const date = document.getElementById("bookingDate").value;
    const time = document.getElementById("bookingTime").value;
    const tableId = document.getElementById("tableId").value;

    if (!name || !date || !time || !tableId) {
        showMessage("Please fill in all fields.", false);
        return;
    }

    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    const bookingId = Date.now();

    const newBooking = {
        bookingId: bookingId,
        customerId: user.customerId,
        customerName: name,
        bookingDate: date,
        bookingTime: time,
        tableId: parseInt(tableId),
        restaurantTable: {
            tableNumber: parseInt(tableId)
        },
        status: "CONFIRMED"
    };

    bookings.push(newBooking);

    localStorage.setItem("bookings", JSON.stringify(bookings));
    localStorage.setItem("latestBooking", JSON.stringify(newBooking));
    localStorage.setItem("lastBooking", JSON.stringify(newBooking));

    alert("🎉 Booking Confirmed!\n\nBooking ID: " + bookingId);

    window.location.href = "booking-confirmation.html";
}

function showMessage(text, success) {
    const msg = document.getElementById("message");
    msg.textContent = text;
    msg.className = success ? "success" : "error";
    msg.style.display = "block";
}
</script>

</body>
</html>
