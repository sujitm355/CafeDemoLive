<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Sujit's Cafe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }

    nav {
      background: #000;
      padding: 0 40px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav .brand { color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; }
    nav a { color: #fff; text-decoration: none; font-size: 15px; }

    .page-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }

    .card h2 {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #111;
    }

    .card p.sub {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
      margin-top: 16px;
    }

    input[type=text],
    input[type=password],
    input[type=email] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #000; }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }

    .btn:hover { background: #222; }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .msg.error {
      background: #fff0f0;
      color: #c0392b;
      border: 1px solid #f5c6cb;
    }

    .msg.success {
      background: #f0fff4;
      color: #27ae60;
      border: 1px solid #b2dfdb;
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #555;
    }

    .footer-link a {
      color: #000;
      font-weight: bold;
      text-decoration: none;
    }

    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">Sujit's Cafe</a>
  <a href="index.html">Home</a>
</nav>

<div class="page-center">
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Login with your email, mobile number, admin username or staff username</p>

    <label>Email / Mobile / Username</label>
    <input type="text" id="identifier" placeholder="you@email.com / 9876543210 / admin / staff"/>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password"/>

    <button class="btn" type="button" onclick="doLogin()">Login</button>

    <div class="msg" id="msg"></div>

    <p class="footer-link">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script>
const BASE_URL = "https://sujitm355.github.io/Cafe_Management_Website/";

function doLogin() {
    const identifier = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!identifier || !password) {
        showMsg("Please fill in all fields.", "error");
        return;
    }

    localStorage.removeItem("cafeUser");
    localStorage.removeItem("adminUser");
    localStorage.removeItem("staffUser");

    if (identifier === "admin" && password === "admin123") {
        localStorage.setItem("adminUser", JSON.stringify({
            username: "admin",
            role: "ADMIN"
        }));

        window.location.href = BASE_URL + "admin-dashboard.html";
        return;
    }

    if (identifier === "staff" && password === "staff123") {
        localStorage.setItem("staffUser", JSON.stringify({
            username: "staff",
            staffName: "Demo Staff",
            role: "STAFF"
        }));

        window.location.href = BASE_URL + "staff-dashboard.html";
        return;
    }

    const users = JSON.parse(localStorage.getItem("cafeUsers")) || [];

    const foundUser = users.find(user =>
        (user.email && user.email.toLowerCase() === identifier.toLowerCase() ||
         user.mobile === identifier) &&
        user.password === password
    );

    if (foundUser) {
        localStorage.setItem("cafeUser", JSON.stringify({
            customerId: foundUser.customerId,
            firstName: foundUser.firstName,
            lastName: foundUser.lastName,
            email: foundUser.email,
            mobile: foundUser.mobile
        }));

        window.location.href = BASE_URL + "index.html";
        return;
    }

    showMsg("Invalid login credentials.", "error");
}

function showMsg(text, type) {
    const msg = document.getElementById("msg");
    msg.textContent = text;
    msg.className = "msg " + type;
    msg.style.display = "block";
}

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        doLogin();
    }
});
</script>

</body>
</html>
