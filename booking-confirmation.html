<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Booking Confirmation</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding: 40px;
}

.card {
    background: white;
    max-width: 600px;
    margin: auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

h1 {
    color: green;
}

.info {
    text-align: left;
    margin-top: 20px;
    line-height: 30px;
}

button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: black;
    color: white;
}
</style>
</head>

<body>

<div class="card" id="bookingCard">

    <h1>✅ Booking Confirmed</h1>

    <div class="info" id="bookingInfo"></div>

    <button onclick="downloadPDF()">📄 Download PDF</button>

    <button onclick="cancelBooking()">❌ Cancel Booking</button>

    <button onclick="printBooking()">🖨️ Print Acknowledgement</button>

    <br>

    <button onclick="window.location.href='index.html'">Back To Home</button>

</div>

<script>
let booking = JSON.parse(localStorage.getItem("lastBooking"));

if (!booking) {
    alert("No booking details found.");
    window.location.href = "booking.html";
}

function displayBooking() {
    document.getElementById("bookingInfo").innerHTML = `
        <b>Booking ID:</b> ${booking.bookingId}<br>
        <b>Name:</b> ${booking.customerName}<br>
        <b>Date:</b> ${booking.bookingDate}<br>
        <b>Time:</b> ${booking.bookingTime}<br>
        <b>Table:</b> ${booking.tableId}<br>
        <b>Status:</b> ${booking.status}
    `;
}

displayBooking();

function printBooking() {
    window.print();
}

function downloadPDF() {
    const element = document.getElementById("bookingCard");

    html2pdf(element, {
        margin: 10,
        filename: "Booking_Acknowledgement_" + booking.bookingId + ".pdf",
        image: {
            type: "jpeg",
            quality: 1
        },
        html2canvas: {
            scale: 2
        },
        jsPDF: {
            unit: "mm",
            format: "a4",
            orientation: "portrait"
        }
    });
}

function cancelBooking() {
    if (!confirm("Are you sure you want to cancel this booking?")) {
        return;
    }

    booking.status = "CANCELLED";

    localStorage.setItem("lastBooking", JSON.stringify(booking));
    localStorage.setItem("latestBooking", JSON.stringify(booking));

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings = bookings.map(item => {
        if (item.bookingId === booking.bookingId) {
            item.status = "CANCELLED";
        }
        return item;
    });

    localStorage.setItem("bookings", JSON.stringify(bookings));

    alert("Booking Cancelled Successfully");

    window.location.href = "index.html";
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>
</html>
