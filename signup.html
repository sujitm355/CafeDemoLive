<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Sujit's Cafe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }

    nav {
      background: #000;
      padding: 0 40px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav .brand { color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; }
    nav a { color: #fff; text-decoration: none; font-size: 15px; }

    .page-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
    }
    .card h2 { font-size: 26px; font-weight: bold; margin-bottom: 6px; color: #111; }
    .card p.sub { font-size: 14px; color: #666; margin-bottom: 28px; }

    .row { display: flex; gap: 14px; }
    .row > div { flex: 1; }

    label { display: block; font-size: 13px; font-weight: bold; color: #333; margin-bottom: 5px; margin-top: 16px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #000; }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }
    .btn:hover { background: #222; }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .msg.error   { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; }
    .msg.success { background: #f0fff4; color: #27ae60; border: 1px solid #b2dfdb; }

    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #555; }
    .footer-link a { color: #000; font-weight: bold; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">Sujit's Cafe</a>
  <a href="index.html">Home</a>
</nav>

<div class="page-center">
  <div class="card">
    <h2>Create account</h2>
    <p class="sub">Join Sujit's Cafe to place orders and book tables</p>

    <div class="row">
      <div>
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="Rahul"/>
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Sharma"/>
      </div>
    </div>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="rahul@email.com"/>

    <label>Mobile Number</label>
    <input type="text" id="mobile" placeholder="9876543210" maxlength="10"/>

    <label>Password</label>
    <input type="password" id="password" placeholder="Create a strong password"/>

    <div id="passwordRules" style="margin-top:8px;font-size:12px;color:#666;">
      <div id="ruleLength">❌ Minimum 8 characters</div>
      <div id="ruleUpper">❌ One uppercase letter</div>
      <div id="ruleLower">❌ One lowercase letter</div>
      <div id="ruleNumber">❌ One number</div>
      <div id="ruleSpecial">❌ One special character</div>
    </div>

    <button class="btn" onclick="doSignup()">Create Account</button>
    <div class="msg" id="msg"></div>

    <p class="footer-link">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script>
if (localStorage.getItem('cafeUser')) {
    window.location.href = 'index.html';
}

const passwordInput = document.getElementById('password');

passwordInput.addEventListener('input', function () {
    const value = passwordInput.value;

    document.getElementById('ruleLength').innerHTML =
        value.length >= 8 ? '✅ Minimum 8 characters' : '❌ Minimum 8 characters';

    document.getElementById('ruleUpper').innerHTML =
        /[A-Z]/.test(value) ? '✅ One uppercase letter' : '❌ One uppercase letter';

    document.getElementById('ruleLower').innerHTML =
        /[a-z]/.test(value) ? '✅ One lowercase letter' : '❌ One lowercase letter';

    document.getElementById('ruleNumber').innerHTML =
        /\d/.test(value) ? '✅ One number' : '❌ One number';

    document.getElementById('ruleSpecial').innerHTML =
        /[@$!%*?&#!]/.test(value) ? '✅ One special character' : '❌ One special character';
});

function doSignup() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!firstName || !lastName || !email || !mobile || !password) {
        showMsg('Please fill in all fields.', 'error');
        return;
    }

    if (!/^\d{10}$/.test(mobile)) {
        showMsg('Mobile number must be 10 digits.', 'error');
        return;
    }

    const passwordRegex =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#!])[A-Za-z\d@$!%*?&#!]{8,}$/;

    if (!passwordRegex.test(password)) {
        showMsg('Password must contain uppercase, lowercase, number, special character and minimum 8 characters.', 'error');
        return;
    }

    const users = JSON.parse(localStorage.getItem('cafeUsers')) || [];

    const emailExists = users.some(user => user.email.toLowerCase() === email.toLowerCase());
    const mobileExists = users.some(user => user.mobile === mobile);

    if (emailExists) {
        showMsg('Email already registered. Please login.', 'error');
        return;
    }

    if (mobileExists) {
        showMsg('Mobile number already registered. Please login.', 'error');
        return;
    }

    const newUser = {
        customerId: Date.now(),
        firstName: firstName,
        lastName: lastName,
        email: email,
        mobile: mobile,
        password: password
    };

    users.push(newUser);
    localStorage.setItem('cafeUsers', JSON.stringify(users));

    localStorage.setItem('cafeUser', JSON.stringify({
        customerId: newUser.customerId,
        firstName: newUser.firstName,
        lastName: newUser.lastName,
        email: newUser.email,
        mobile: newUser.mobile
    }));

    window.location.href = 'welcome.html';
}

function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + type;
    msg.style.display = 'block';
}
</script>

</body>
</html>
