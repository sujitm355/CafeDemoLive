<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Sujit's Cafe</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.popup{

    background:white;

    padding:40px;

    border-radius:12px;

    text-align:center;

    box-shadow:0 4px 20px rgba(0,0,0,0.2);

    width:400px;
}

.popup h1{

    margin-bottom:15px;
}

.popup p{

    color:#555;
    margin-bottom:25px;
}

button{

    background:black;
    color:white;

    border:none;

    padding:12px 25px;

    border-radius:8px;

    cursor:pointer;
}

button:hover{

    background:#222;
}

</style>

</head>
<body>

<div class="popup">

    <h1>🎉 Welcome to Sujit's Cafe ☕</h1>

    <p>
        Your account has been created successfully.
        Enjoy ordering food and booking tables with us.
    </p>

    <button onclick="continueToHome()">
        Continue
    </button>

</div>

<script>

function continueToHome(){

    window.location.href="index.html";

}

</script>

</body>
</html>
