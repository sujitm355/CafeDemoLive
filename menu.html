<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Sujit's Cafe</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #000;
            color: #fff;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .header button {
            margin-left: 10px;
            padding: 9px 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        main {
            padding: 30px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 34px;
        }

        .category-table {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            align-items: start;
        }

        .category-column {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .category-heading {
            background: #000;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .menu-row {
            display: grid;
            grid-template-columns: 1fr 90px;
            gap: 12px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            min-height: 135px;
        }

        .menu-row:last-child {
            border-bottom: none;
        }

        .menu-info h3 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .menu-info p {
            margin: 5px 0;
            color: #555;
            font-size: 13px;
        }

        .menu-price {
            font-weight: bold;
            color: #000 !important;
            font-size: 17px !important;
        }

        .menu-action {
            text-align: center;
        }

        .menu-action img {
            width: 85px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 8px;
        }

        .qty-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .qty-box button {
            width: 28px;
            height: 28px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-box span {
            min-width: 18px;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .category-table {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <h1>Our Menu</h1>
    <div>
        <button onclick="goToCart()">Cart</button>
        <button onclick="goToHome()">Home</button>
    </div>
</header>

<main>
    <h2 class="page-title">Choose Your Favorite Items</h2>

    <div class="category-table">
        <div class="category-column">
            <div class="category-heading">Burgers</div>
            <div id="burgers-list"></div>
        </div>

        <div class="category-column">
            <div class="category-heading">Sandwiches</div>
            <div id="sandwiches-list"></div>
        </div>

        <div class="category-column">
            <div class="category-heading">Beverages</div>
            <div id="beverages-list"></div>
        </div>
    </div>
</main>

<script src="js/menu-data.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
